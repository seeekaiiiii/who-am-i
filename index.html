<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>我是谁</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f6fd6'/%3E%3Ctext x='50' y='55' font-family='sans-serif' font-size='52' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='central'%3E%E8%97%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="menubar">
    <span class="mb-brand">who am i</span>
    <nav class="mb-nav" id="mb-nav">
      <button class="mbtn active" data-view="home">主页</button>
      <button class="mbtn" data-view="shelf">Muuusic！</button>
    </nav>
  </header>

  <main class="main">
    <!-- 第一屏提问，往下滚有答案 -->
    <section id="view-home" class="view">
      <div class="home-screen">
        <div class="home-question">我是谁<span class="q">？</span></div>
        <div class="home-hint">↓</div>
      </div>
      <div class="home-screen">
        <div class="home-answer">我也不知道我是谁<span class="w">=w=</span></div>
      </div>
    </section>

    <section id="view-shelf" class="view">
      <div class="view-head"><h2>▍Muuusic！</h2></div>
      <div id="shelf-zone">
        <div id="shelf-viewport">
          <div id="shelf-strip"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="stage">
    <div id="stage-bg"></div>
    <button id="stage-close" class="t-btn stage-x" title="关闭 (Esc)">✕</button>
    <div class="stage-inner">
      <div class="photo-frame">
        <div class="frame-cover" id="stage-cover"></div>
      </div>
      <div class="stage-side">
        <h3 id="stage-title"></h3>
        <p class="stage-sub" id="stage-artist"></p>
        <p class="stage-lyric" id="stage-lyric"></p>
        <div id="stage-player"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
